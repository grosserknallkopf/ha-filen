name: Feature request
description: Suggest an idea for the Filen integration
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! German or English is fine.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the use case, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it behave in Home Assistant?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other integrations you tried.
