name: Release native bridge

on:
  push:
    branches:
      - "native-wheel-check"
    tags:
      - "native-v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to PyPI and create a GitHub release (leave off for a build-only validation)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  wheels:
    name: Wheel ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            manylinux: auto
          - target: aarch64-unknown-linux-gnu
            manylinux: auto
          - target: armv7-unknown-linux-gnueabihf
            manylinux: auto
          - target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
          - target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
          - target: armv7-unknown-linux-musleabihf
            manylinux: musllinux_1_2
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@v1
        env:
          # ring's cross-compiled aarch64 assembly expects GCC to define this.
          CFLAGS_aarch64_unknown_linux_gnu: -D__ARM_ARCH=8
        with:
          working-directory: native
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: native/dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: native
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: native/dist/*.tar.gz
          if-no-files-found: error

  verify:
    name: Verify native wheels
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Check that every wheel bundles UniFFI Python bindings
        run: python3 native/verify_wheels.py dist/*.whl
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"
      - name: Import the x86_64 glibc wheel and check the public API
        run: |
          python3 -m pip install --no-deps dist/*manylinux*x86_64.whl
          python3 -c 'import filen_sdk_native as sdk; assert all(hasattr(sdk, name) for name in ("Credentials", "SourceRead", "SdkClient", "login"))'

  publish:
    name: Publish to PyPI
    if: github.ref_type == 'tag' || inputs.publish
    needs: [verify]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
