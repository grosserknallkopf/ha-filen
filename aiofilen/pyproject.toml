[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiofilen"
version = "0.2.0"
description = "Async Python facade around the official Filen Rust SDK"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.12"
dependencies = [
    "filen-sdk-native==0.1.0b2",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "pytest-timeout"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aiofilen = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# The HA test plugin (if installed) blocks real sockets; these tests need them.
addopts = "-p no:homeassistant"
testpaths = ["tests"]
